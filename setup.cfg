[metadata]
name = paper2html
version = 0.2.0
description = A configurable API agent for page-grounded Chinese paper articles
long_description = file: README.md
long_description_content_type = text/markdown
license_files = LICENSE

[options]
packages = find:
python_requires = >=3.10
install_requires =
    PyMuPDF==1.24.11
    markdown-it-py==3.0.0
    mdurl==0.1.2
include_package_data = True

[options.packages.find]
include = paper2html*

[options.package_data]
paper2html = web/*, prompts/*

[options.entry_points]
console_scripts =
    paper2html = paper2html.cli:main
